<!-- put the club's last-seen look back before the first paint (js/look.js saves it) -->
<script>
try {
  var L = JSON.parse(localStorage.getItem("bc_look") || "null");
  if (L) {
    var R = document.documentElement;
    for (var k in L.vars) R.style.setProperty(k, L.vars[k]);
    R.dataset.frame = L.frame; R.dataset.ground = L.ground;
    if (L.name) document.title = L.name;
  }
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Bungee&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&family=Courier+Prime:wght@400;700&family=Creepster&family=Fredericka+the+Great&family=Henny+Penny&family=Homemade+Apple&family=IM+Fell+English+SC&family=Lobster&family=Mountains+of+Christmas:wght@700&family=Noto+Sans+Runic&family=Nothing+You+Could+Do&family=Special+Elite&family=UnifrakturMaguntia&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="tab-shelf">
<main class="page">
  <header class="panel mast">
    <div class="mast-line">
      <span id="dateline"></span>
      <span id="volline">Vol. I</span>
      <span id="nowline"></span>
    </div>
    <div class="mast-title">
      <svg class="sprig" viewBox="0 0 70 110" aria-hidden="true">
        <g class="stem"><path d="M40 108C37 84 33 58 40 30C43 18 48 9 55 2"/><path d="M36 64C28 58 22 50 20 40"/></g>
        <g class="leaves">
          <path transform="translate(38 94) rotate(-160)" d="M0 0C3-5 10-7 15-6C11-2 5 1 0 0Z"/>
          <path transform="translate(37 82) rotate(-28)" d="M0 0C3-5 10-7 15-6C11-2 5 1 0 0Z"/>
          <path transform="translate(35 70) rotate(-150)" d="M0 0C3-5 10-7 13-6C10-2 5 1 0 0Z"/>
          <path transform="translate(35 55) rotate(-36)" d="M0 0C3-5 10-7 13-6C10-2 5 1 0 0Z"/>
          <path transform="translate(37 43) rotate(-138)" d="M0 0C3-5 8-6 11-5C8-2 4 1 0 0Z"/>
          <path transform="translate(25 52) rotate(-118)" d="M0 0C2-4 7-5 9-4C7-1 3 1 0 0Z"/>
        </g>
        <g class="buds">
          <ellipse cx="43" cy="25" rx="2" ry="3.2" transform="rotate(30 43 25)"/>
          <ellipse cx="48.5" cy="17" rx="1.9" ry="3" transform="rotate(35 48.5 17)"/>
          <ellipse cx="45" cy="15" rx="1.6" ry="2.6" transform="rotate(-20 45 15)"/>
          <ellipse cx="52.5" cy="9.5" rx="1.7" ry="2.7" transform="rotate(40 52.5 9.5)"/>
          <ellipse cx="50" cy="7" rx="1.4" ry="2.3" transform="rotate(-10 50 7)"/>
          <circle cx="55.5" cy="2.5" r="1.5"/>
          <circle cx="19.5" cy="38.5" r="1.9"/><circle cx="22.8" cy="37.2" r="1.5"/><circle cx="18.2" cy="35" r="1.4"/>
        </g>
      </svg>
      <h1 class="logo" id="club-name">Book Club</h1>
      <svg class="sprig r" viewBox="0 0 70 110" aria-hidden="true">
        <g class="stem"><path d="M40 108C37 84 33 58 40 30C43 18 48 9 55 2"/><path d="M36 64C28 58 22 50 20 40"/></g>
        <g class="leaves">
          <path transform="translate(38 94) rotate(-160)" d="M0 0C3-5 10-7 15-6C11-2 5 1 0 0Z"/>
          <path transform="translate(37 82) rotate(-28)" d="M0 0C3-5 10-7 15-6C11-2 5 1 0 0Z"/>
          <path transform="translate(35 70) rotate(-150)" d="M0 0C3-5 10-7 13-6C10-2 5 1 0 0Z"/>
          <path transform="translate(35 55) rotate(-36)" d="M0 0C3-5 10-7 13-6C10-2 5 1 0 0Z"/>
          <path transform="translate(37 43) rotate(-138)" d="M0 0C3-5 8-6 11-5C8-2 4 1 0 0Z"/>
          <path transform="translate(25 52) rotate(-118)" d="M0 0C2-4 7-5 9-4C7-1 3 1 0 0Z"/>
        </g>
        <g class="buds">
          <ellipse cx="43" cy="25" rx="2" ry="3.2" transform="rotate(30 43 25)"/>
          <ellipse cx="48.5" cy="17" rx="1.9" ry="3" transform="rotate(35 48.5 17)"/>
          <ellipse cx="45" cy="15" rx="1.6" ry="2.6" transform="rotate(-20 45 15)"/>
          <ellipse cx="52.5" cy="9.5" rx="1.7" ry="2.7" transform="rotate(40 52.5 9.5)"/>
          <ellipse cx="50" cy="7" rx="1.4" ry="2.3" transform="rotate(-10 50 7)"/>
          <circle cx="55.5" cy="2.5" r="1.5"/>
          <circle cx="19.5" cy="38.5" r="1.9"/><circle cx="22.8" cy="37.2" r="1.5"/><circle cx="18.2" cy="35" r="1.4"/>
        </g>
      </svg>
    </div>
    <p class="tagline" id="tagline">★ like game club but for books ★</p>
    <div class="mast-rule" aria-hidden="true"><span class="seal" id="seal">BC</span></div>
    <nav class="nav" id="nav"></nav>
  </header>

  <div class="ticker" aria-label="Stupid but true book facts"><div class="lbl">Book Facts</div><div class="run"><span id="facts">Dusting off the facts...</span></div></div>

  <div class="cols">
    <section class="panel wall" aria-label="Bookshelf">
      <div class="sec-head">
        <div><span class="kicker" id="round-no">The Shelf</span><h2>Book Picks</h2></div>
        <span class="rnd" id="round-badge">Under 150 pages</span>
      </div>
      <div class="budget" id="budget"></div>
      <div class="shelf"><div class="items" id="shelf"></div></div>
      <p class="waitlist" id="waitlist" hidden></p>
      <div class="drop" id="bin"></div>
    </section>

    <aside class="im" aria-label="Chat room">
      <div class="win">
        <div class="tbar"><span class="ico">❦</span><span class="t" id="chat-title">Book Club Chat Room</span></div>
        <div class="menu" id="chat-menu"></div>
        <div class="here glit" id="here"></div>
        <div class="chatlog glit" id="chatlog" aria-live="polite"></div>
        <div id="chat-send"></div>
      </div>
      <section class="panel pep" id="pep" aria-label="Daily Reading"></section>
    </aside>
  </div>

  <footer class="foot">
    <p class="colophon" id="colophon">Book Club · a small reading society</p>
    <div class="badges">
      <span class="badge"><b>BEST VIEWED</b><i>1024x768</i></span>
      <span class="badge"><b>MADE W/</b><i>NOTEPAD</i></span>
      <span class="badge"><b>BOOKS BY</b><i>OPEN LIBRARY</i></span>
      <span class="badge"><b>POWERED BY</b><i>TEA</i></span>
    </div>
  </footer>
</main>

<nav class="mtabs" id="mtabs">
  <button type="button" class="on" data-tab="shelf">The Shelf</button>
  <button type="button" data-tab="chat">Chat<b id="unread" hidden>0</b></button>
</nav>

<div id="layer"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
