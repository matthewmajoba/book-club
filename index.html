<!-- put the club's last-seen look back before the first paint (js/look.js saves it) -->
<script>
try {
  var L = JSON.parse(localStorage.getItem("bc_look") || "null");
  if (L && L.v === 2) {
    var R = document.documentElement;
    for (var k in L.vars) R.style.setProperty(k, L.vars[k]);
    R.dataset.frame = L.frame; R.dataset.ground = L.ground;
    if (L.name) document.title = L.name;
  }
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Bungee&family=Courier+Prime:wght@400;700&family=Creepster&family=Fredericka+the+Great&family=Grandstander:ital,wght@0,700;0,900;1,700;1,800&family=Henny+Penny&family=Homemade+Apple&family=IM+Fell+English+SC&family=Lobster&family=Mountains+of+Christmas:wght@700&family=Noto+Sans+Runic&family=Nunito:ital,wght@0,600;0,800;1,600&family=Special+Elite&family=UnifrakturMaguntia&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="tab-shelf">
<main class="page">
  <header class="panel mast">
    <h1 class="logo" id="club-name">Book Club</h1>
    <p class="tagline" id="tagline">like game club but for books</p>
    <p class="nowline" id="nowline"></p>
  </header>
  <nav class="nav" id="nav" aria-label="Menu"></nav>

  <div class="ticker" aria-label="Stupid but true book facts"><div class="lbl">Book Facts</div><div class="run"><span id="facts">Dusting off the facts...</span></div></div>

  <div class="cols">
    <section class="panel wall" aria-label="Bookshelf">
      <div class="sec-head">
        <div><span class="kicker" id="round-no">The Shelf</span><h2>Book Picks</h2></div>
        <span class="rnd" id="round-badge">Under 150 pages</span>
      </div>
      <div class="budget" id="budget"></div>
      <div class="shelf"><div class="items" id="shelf"></div></div>
      <p class="waitlist" id="waitlist" hidden></p>
      <div class="drop" id="bin"></div>
    </section>

    <aside class="im" aria-label="Chat room">
      <div class="win">
        <div class="tbar"><span class="ico">❦</span><span class="t" id="chat-title">Book Club Chat Room</span></div>
        <div class="menu" id="chat-menu"></div>
        <div class="here glit" id="here"></div>
        <div class="chatlog glit" id="chatlog" aria-live="polite"></div>
        <div id="chat-send"></div>
      </div>
      <section class="panel pep" id="pep" aria-label="Daily Reading"></section>
    </aside>
  </div>

  <footer class="foot">
    <p class="colophon" id="colophon">Book Club · a small reading society</p>
    <div class="badges">
      <span class="badge"><b>BEST VIEWED</b><i>1024x768</i></span>
      <span class="badge"><b>MADE W/</b><i>LOVE</i></span>
      <span class="badge"><b>BOOKS BY</b><i>OPEN LIBRARY</i></span>
      <span class="badge"><b>ASK</b><i>GRANDMA</i></span>
    </div>
    <a class="credits" href="credits.html">photo credits</a>
  </footer>
</main>

<nav class="mtabs" id="mtabs">
  <button type="button" class="on" data-tab="shelf">The Shelf</button>
  <button type="button" data-tab="chat">Chat<b id="unread" hidden>0</b></button>
</nav>

<div id="layer"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
